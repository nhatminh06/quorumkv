name: Deploy incident evidence to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/evidence/canonical/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Assemble evidence-backed static site
        run: |
          mkdir -p site/data
          cp docs/evidence/canonical/manifest.json site/data/
          cp docs/evidence/canonical/timeline.json site/data/
          cp docs/evidence/canonical/workload-summary.json site/data/
          cp docs/evidence/canonical/acknowledged-writes-summary.json site/data/
          cp docs/evidence/canonical/initial-status.json site/data/
          cp docs/evidence/canonical/failover-status.json site/data/
          cp docs/evidence/canonical/final-status.json site/data/

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
